<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CÔNG CỤ TẠO BANNER QUẢNG CÁO TỰ ĐỘNG</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* BASE & RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #E0E0E0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* CONTROL PANEL */
        .control-panel {
            background-color: #242442;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 650px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        h2 {
            color: #FFD700;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #00aaff;
            font-weight: 600;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #1a1a2e;
            border: 1px solid #ff33ff;
            border-radius: 5px;
            color: white;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-group > div {
            flex: 1;
        }
        
        /* BANNER CONTAINER (CANVAS MOCKUP) */
        #bannerContainer {
            position: relative;
            width: 600px; 
            height: 400px;
            border: 4px solid #ff33ff;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 51, 255, 0.5);
        }
        
        /* BANNER ELEMENTS */
        #productImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8; /* Ảnh hơi mờ để chữ nổi bật */
        }

        #overlayText {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .price-tag {
            background-color: rgba(255, 87, 34, 0.95); /* Cam/Đỏ */
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 87, 34, 0.8);
            margin-top: 10px;
        }

        .promo-text {
            background-color: rgba(0, 170, 255, 0.85); /* Xanh Dương */
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .contact-info {
            background-color: rgba(76, 175, 80, 0.9); /* Xanh Lá */
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.3em;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.8);
            margin-bottom: 20px;
        }

        /* NÚT SUBMIT */
        #exportButton {
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        #exportButton:hover {
            background-color: #388E3C;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>✨ CÔNG CỤ TẠO BANNER QUẢNG CÁO CHUYÊN NGHIỆP</h2>
        
        <div class="upload-group">
            <label for="imgFile">1. Tải lên Ảnh Sản Phẩm/Shop (Ảnh chính cho Banner):</label>
            <input type="file" id="imgFile" accept="image/*" onchange="loadProductImage(event)">
        </div>

        <div class="input-group">
            <div>
                <label for="productName">2. Tên Sản Phẩm/Shop:</label>
                <input type="text" id="productName" value="DỊCH VỤ THIẾT KẾ" oninput="updateBanner()">
            </div>
            <div>
                <label for="price">3. Giá (VNĐ):</label>
                <input type="text" id="price" value="50.000" oninput="updateBanner()">
            </div>
        </div>

        <div class="input-group">
             <div>
                <label for="promoText">4. Văn bản Khuyến mãi (trên cùng):</label>
                <input type="text" id="promoText" value="GIẢM 50% HÔM NAY" oninput="updateBanner()">
            </div>
            <div>
                <label for="zaloContact">5. SĐT/Zalo Liên hệ:</label>
                <input type="text" id="zaloContact" value="0703305743" oninput="updateBanner()">
            </div>
        </div>
        
        <button id="exportButton" onclick="exportBanner()">6. TẠO & XUẤT BANNER (PNG)</button>
    </div>

    <div id="bannerContainer">
        <img id="productImage" src="" alt="Ảnh Sản Phẩm">
        <div id="overlayText">
            <div id="promoBox" class="promo-text"></div>
            <div>
                <div id="nameBox" style="font-size: 1.5em; font-weight: bold; color: white; text-shadow: 0 0 5px #000;"></div>
                <div id="priceBox" class="price-tag"></div>
            </div>
            <div id="contactBox" class="contact-info"></div>
        </div>
    </div>
    
    <a id="downloadLink" download="QuangCao_Banner.png" style="display: none;"></a>

    <script>
        const productImage = document.getElementById('productImage');
        const promoBox = document.getElementById('promoBox');
        const nameBox = document.getElementById('nameBox');
        const priceBox = document.getElementById('priceBox');
        const contactBox = document.getElementById('contactBox');
        const bannerContainer = document.getElementById('bannerContainer');

        function loadProductImage(event) {
            const file = event.target.files[0];
            if (file) {
                productImage.src = URL.createObjectURL(file);
                updateBanner(); // Cập nhật ngay sau khi tải ảnh
            }
        }
        
        function updateBanner() {
            const price = document.getElementById('price').value;
            const promoText = document.getElementById('promoText').value;
            const productName = document.getElementById('productName').value;
            const zaloContact = document.getElementById('zaloContact').value;
            
            // Cập nhật các lớp phủ
            promoBox.textContent = promoText.toUpperCase();
            nameBox.textContent = productName.toUpperCase();
            
            if (price) {
                 priceBox.textContent = `CHỈ CÒN: ${price} VNĐ`;
            } else {
                 priceBox.textContent = `CHỈ CÒN: [GIÁ]`;
            }

            if (zaloContact) {
                contactBox.textContent = `☎️ LIÊN HỆ ZALO: ${zaloContact}`;
            } else {
                 contactBox.textContent = `☎️ LIÊN HỆ ZALO: [SĐT]`;
            }

            // Tự động ẩn các ô nếu không có nội dung (ví dụ: promo)
            promoBox.style.display = promoText ? 'block' : 'none';
        }

        function exportBanner() {
            if (!productImage.src) {
                alert("❌ Vui lòng tải lên Ảnh Sản Phẩm/Shop trước khi xuất banner.");
                return;
            }
            
            const exportButton = document.getElementById('exportButton');
            exportButton.textContent = 'Đang xử lý... Vui lòng chờ.';
            exportButton.disabled = true;

            html2canvas(bannerContainer, {
                allowTaint: true,
                useCORS: true,
                scale: 2 
            }).then(function(canvas) {
                const link = document.getElementById('downloadLink');
                
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                exportButton.textContent = '✅ XUẤT BANNER THÀNH CÔNG (TẢI VỀ)';
                exportButton.disabled = false;
            });
        }
        
        // Khởi tạo giao diện lần đầu
        document.addEventListener('DOMContentLoaded', updateBanner);
    </script>

</body>
</html>
